name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build Docker Image with Maven Buildpacks
        run: mvn --batch-mode --no-transfer-progress spring-boot:build-image -Dspring-boot.build-image.imageName=authpoc:latest
