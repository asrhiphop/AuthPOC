name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: authpoc_integration
          POSTGRES_USER: authpoc_integration
          POSTGRES_PASSWORD: authpoc_integration_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authpoc_integration -d authpoc_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 21.0.12
        uses: actions/setup-java@v5
        with:
          java-version: '21.0.12'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run All Tests (Unit & Integration)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: authpoc_integration
          POSTGRES_USER: authpoc_integration
          POSTGRES_PASSWORD: authpoc_integration_password
        run: ./mvnw --batch-mode --no-transfer-progress -Pintegration clean verify

      - name: Build Docker Image
        run: docker build -t authpoc:latest .