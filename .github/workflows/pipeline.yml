name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21.0.12
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21.0.12'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build Docker Image with Maven Buildpacks
        run: ./mvnw --batch-mode --no-transfer-progress spring-boot:build-image -Dspring-boot.build-image.imageName=authpoc:latest
